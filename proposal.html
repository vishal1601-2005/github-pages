<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff4d6d, #ff758f);
            color: white;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 15px;
            max-width: 600px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2rem;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .heart {
            font-size: 3rem;
            margin: 20px 0;
            animation: heartbeat 1.2s infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .teddy {
            position: relative;
            width: 120px;
            height: 120px;
            background-color: purple;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .teddy::before,
        .teddy::after {
            content: "";
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: purple;
            border-radius: 50%;
        }

        .teddy::before {
            top: -25px;
            left: -25px;
        }

        .teddy::after {
            top: -25px;
            right: -25px;
        }

        .teddy .face {
            width: 80px;
            height: 80px;
            background-color: purple;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
        }

        .teddy .eyes {
            position: absolute;
            top: 30px;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
        }

        .teddy .eye-left { left: 25px; }
        .teddy .eye-right { right: 25px; }

        .teddy .nose {
            position: absolute;
            top: 45px;
            width: 10px;
            height: 6px;
            background: black;
            border-radius: 50%;
        }

        .teddy .feet {
            position: absolute;
            bottom: -20px;
            width: 25px;
            height: 25px;
            background: purple;
            border-radius: 50%;
        }

        .teddy .foot-left { left: 15px; }
        .teddy .foot-right { right: 15px; }

        .teddy .foot-left::after,
        .teddy .foot-right::after {
            content: "";
            position: absolute;
            bottom: 5px;
            left: 5px;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            font-size: 1rem;
            padding: 8px 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .yes {
            background-color: #ffeb3b;
            color: black;
            font-weight: bold;
        }

        .yes:hover {
            background-color: #ffc107;
        }

        .no {
            background-color: white;
            color: black;
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="teddy">
            <div class="face">
                <div class="eyes eye-left"></div>
                <div class="eyes eye-right"></div>
                <div class="nose"></div>
            </div>
            <div class="feet foot-left"></div>
            <div class="feet foot-right"></div>
        </div>
        <h1>Will You Be My Valentine, Honey? 💕</h1>
        <p>You make my world brighter every day. Be mine forever? 🥰</p>
        
        <div class="heart">💖</div>

        <div class="buttons">
            <button class="yes" onclick="showLove()">Yes! 💕</button>
            <button class="no" onclick="noChoice()">No 😢</button>
        </div>
    </div>

    <script>
        function showLove() {
            alert("Yay! I knew you'd say yes! 💖🥰");
        }

        function noChoice() {
            alert("Sorry, you don't have a choice honey, you are stuck with me! 😘💖");
        }
    </script>

</body>
</html>
